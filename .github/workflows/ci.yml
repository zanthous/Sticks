name: Continuous integration

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "true"

jobs:
  test:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Restore dependencies
        run: dotnet restore .\osu.Game.Rulesets.Sticks.sln

      - name: Build and test
        run: dotnet test .\osu.Game.Rulesets.Sticks.sln --configuration Release --no-restore

      - name: Validate companion mapper timing
        run: node .\osu.Game.Rulesets.Sticks.Tests\validate-mapper-timing.mjs
